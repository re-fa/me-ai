<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="./manifest.json">
    <title>محادثة P2P مباشرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app-shell">

    <header class="app-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">محادثة P2P</span>
            </div>
            <div id="connectionStatus" class="status-badge status-idle">
                <span class="status-dot"></span>
                <span id="statusText">جاهز</span>
            </div>
        </div>
    </header>

    <main class="app-main">

        <!-- لوحة الإعداد -->
        <section id="setupPanel" class="panel panel-setup">

            <div class="mode-tabs" role="tablist">
                <button class="mode-tab active" data-mode="host" role="tab">🏠 إنشاء غرفة</button>
                <button class="mode-tab" data-mode="join" role="tab">🔗 الانضمام</button>
            </div>

            <!-- مسار المضيف -->
            <div id="hostFlow" class="flow-container">

                <div class="step-card">
                    <div class="step-header">
                        <span class="step-num">1</span>
                        <span>رمز الدعوة</span>
                    </div>
                    <div class="step-body">
                        <textarea id="offerOutput" readonly placeholder="جاري التوليد..." rows="3"></textarea>
                        <div class="field-actions">
                            <button id="copyOfferBtn" class="btn btn-copy" disabled>📋 نسخ</button>
                            <button id="showQrOfferBtn" class="btn btn-ghost" disabled>📱 رمز QR</button>
                        </div>
                        <div id="qrOfferBox" class="qr-box hidden">
                            <canvas id="offerQrCanvas"></canvas>
                            <button id="downloadQrOfferBtn" class="btn btn-primary btn-full">💾 حفظ كصورة</button>
                            <button id="closeQrOfferBtn" class="btn btn-ghost btn-full">إغلاق</button>
                        </div>
                        <div id="hostLoading" class="loading-row">
                            <div class="spinner spinner-sm"></div>
                            <span>جاري جمع معلومات الشبكة...</span>
                        </div>
                    </div>
                </div>

                <div id="hostAnswerSection" class="step-card step-locked">
                    <div class="step-header">
                        <span class="step-num">2</span>
                        <span>إكمال الاتصال</span>
                    </div>
                    <div class="step-body">
                        <textarea id="answerInput" placeholder="الصق رمز الإجابة..." rows="3"></textarea>
                        <button id="completeConnectionBtn" class="btn btn-primary btn-full" disabled>🔗 إكمال الاتصال</button>
                    </div>
                </div>

            </div>

            <!-- مسار المنضم -->
            <div id="joinFlow" class="flow-container hidden">

                <div class="step-card">
                    <div class="step-header">
                        <span class="step-num">1</span>
                        <span>لصق رمز الدعوة</span>
                    </div>
                    <div class="step-body">
                        <textarea id="offerInput" placeholder="الصق رمز الدعوة هنا..." rows="3"></textarea>
                        <div class="field-actions">
                            <button id="scanQrBtn" class="btn btn-ghost">📷 مسح QR</button>
                            <button id="generateAnswerBtn" class="btn btn-primary">⚙️ توليد الإجابة</button>
                        </div>
                        <div id="qrScanBox" class="qr-box hidden">
                            <video id="qrScanVideo" playsinline></video>
                            <button id="stopScanBtn" class="btn btn-ghost btn-full">إيقاف المسح</button>
                        </div>
                    </div>
                </div>

                <div id="joinAnswerSection" class="step-card step-locked">
                    <div class="step-header">
                        <span class="step-num">2</span>
                        <span>رمز الإجابة</span>
                    </div>
                    <div class="step-body">
                        <textarea id="answerOutput" readonly placeholder="جاري التوليد..." rows="3"></textarea>
                        <div class="field-actions">
                            <button id="copyAnswerBtn" class="btn btn-copy" disabled>📋 نسخ</button>
                            <button id="showQrAnswerBtn" class="btn btn-ghost" disabled>📱 رمز QR</button>
                        </div>
                        <div id="qrAnswerBox" class="qr-box hidden">
                            <canvas id="answerQrCanvas"></canvas>
                            <button id="downloadQrAnswerBtn" class="btn btn-primary btn-full">💾 حفظ كصورة</button>
                            <button id="closeQrAnswerBtn" class="btn btn-ghost btn-full">إغلاق</button>
                        </div>
                    </div>
                </div>

            </div>

            <div id="errorBanner" class="error-banner hidden">
                <span>⚠️</span>
                <span id="errorMessage"></span>
                <button id="retryBtn" class="btn btn-sm btn-ghost">إعادة المحاولة</button>
            </div>

        </section>

        <!-- لوحة المحادثة -->
        <section id="chatPanel" class="panel panel-chat hidden">

            <div class="chat-header">
                <div class="peer-info">
                    <div class="peer-avatar">👤</div>
                    <div>
                        <div class="peer-name">جهاز متصل</div>
                        <div class="peer-status">
                            <span class="status-dot status-online"></span>
                            اتصال مباشر
                        </div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button id="toggleAudioBtn" class="btn btn-icon btn-ghost" title="مكالمة صوتية">📞</button>
                    <button id="toggleVideoBtn" class="btn btn-icon btn-ghost" title="مكالمة فيديو">🎥</button>
                    <button id="disconnectBtn" class="btn btn-icon btn-ghost" title="قطع الاتصال">✕</button>
                </div>
            </div>

            <!-- منطقة الفيديو -->
            <div id="videoArea" class="video-area hidden">
                <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
                <video id="localVideo" class="local-video" autoplay playsinline muted></video>
                <div class="video-controls">
                    <button id="hangupVideoBtn" class="btn btn-danger btn-full">📵 إنهاء المكالمة</button>
                </div>
            </div>

            <div id="chatMessages" class="chat-messages" role="log"></div>

            <div class="chat-composer">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك..." maxlength="2000" disabled>
                <button id="sendBtn" class="btn btn-send" disabled>➤</button>
            </div>

        </section>

    </main>

    <div id="toast" class="toast hidden"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="app.js"></script>
</body>
</html>
